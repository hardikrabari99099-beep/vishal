# Render Blueprint for IndiFunded.
# Contains NO secret values. Items marked "sync: false" are typed in by you in the
# Render dashboard (Environment tab) so they never end up in GitHub.
services:
  - type: web
    name: indifunded
    runtime: node
    region: singapore          # closest Render region to India
    plan: starter              # the free plan "sleeps" and would interrupt payments/webhooks
    buildCommand: npx --yes bun@1 install --frozen-lockfile && npx --yes bun@1 run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeploy: false          # deploy manually after you have reviewed changes
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # ---- Supabase: public values (safe to be visible) ----
      - key: SUPABASE_URL
        value: https://iigpitlqtihexjbxelzr.supabase.co
      - key: SUPABASE_JWKS_URL
        value: https://iigpitlqtihexjbxelzr.supabase.co/auth/v1/.well-known/jwks.json
      - key: VITE_SUPABASE_URL
        value: https://iigpitlqtihexjbxelzr.supabase.co
      # ---- Supabase: keys (you type these in Render) ----
      - key: SUPABASE_PUBLISHABLE_KEY      # public "sb_publishable_..." key
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY # SAME publishable key (used by the website at build time)
        sync: false
      - key: SUPABASE_SECRET_KEY           # PRIVATE "sb_secret_..." key - server only
        sync: false
      # ---- Login-session signing secret (any long random text; keep it stable) ----
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      # ---- Razorpay: re-use your EXISTING values, unchanged ----
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # ---- Optional: only if you already use them today ----
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
